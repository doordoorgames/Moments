*{box-sizing:border-box}body{margin:0;background:#F6EFE3;color:#000;font-family:'Bricolage Grotesque',sans-serif;padding:24px 18px 130px}h1{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(38px,8vw,72px);margin:0 0 14px}button{font:inherit;cursor:pointer;background:white;border:2px solid black;padding:10px 16px;box-shadow:4px 4px 0 black}button:focus-visible,a:focus-visible{outline:3px solid #8b3048;outline-offset:5px}button[aria-pressed=true]{background:black;color:white}nav{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:#F6EFE3;border:2px solid black;box-shadow:6px 6px 0 black;padding:10px;overflow-wrap:anywhere}.tile{background:white;aspect-ratio:1;display:flex;align-items:center;justify-content:center}.tile img{max-width:100%;max-height:100%;object-fit:contain}.card h2{font-size:18px}.card p{font-size:14px;margin:8px 0}.card button{margin:15px 0 5px;width:100%}.rejected{outline:4px solid #8b3048}.bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:#F6EFE3;border-top:3px solid black;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.empty{font-size:18px;max-width:650px}@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}body{padding:40px 40px 120px}}

-27174565.jpeg", "license": "Pexels License", "license_url": "https://www.pexels.com/license/", "creator": "José Martin Segura Benites", "attribution": "White and brown handbag — José Martin Segura Benites, Pexels License; resized and converted to WebP. Brand not verified.", "id": "746763bc7a523244740a435d97e0c10d1169db32b3bc4d8a48703fe96ce0f99d", "name": "White and brown handbag", "category": "handbags", "image": "/assets/shop/pexels-fashion/handbags/white-and-brown-handbag-746763bc7a52.webp", "width": 256, "height": 256, "source": "pexels-fashion", "collected_at": "2026-10-12T18:20:33.711964+00:00"}, {"source_url": "https://www.pexels.com/photo/black-dress-on-cloth-hanger-19895964/", "image_url": "https://images.pexels.com/photos/19895964/pexels-photo-19895964.jpeg", "license": "Pexels License", "license_url": "https://www.pexels.com/license/", "creator": "Marcelo Verfe", "attribution": "Black dress on hanger — Marcelo Verfe, Pexels License; resized and converted to WebP. Brand not verified.", "id": "dbab7589cee50cbe043cef712e8ce69e022751f2ea4cd840c0c0ebf23303c985", "name": "Black dress on hanger", "category": "dresses", "image": "/assets/shop/pexels-fashion/dresses/black-dress-on-hanger-dbab7589cee5.webp", "width": 183, "height": 256, "source": "pexels-fashion", "collected_at": "2026-10-12T18:20:49.270584+00:00"}, {"source_url": "https://www.pexels.com/photo/elegant-woman-in-stylish-white-floral-dress-30590678/", "image_url": "https://images.pexels.com/photos/30590678/pexels-photo-30590678.jpeg", "license": "Pexels License", "license_url": "https://www.pexels.com/license/", "creator": "Andrea Musto", "attribution": "White floral dress — Andrea Musto, Pexels License; resized and converted to WebP. Brand not verified.", "id": "b9b6c3a4168d31f7044d396aad5c3b90e00a61d8c7e19d671343d1f4bae8f590", "name": "White floral dress", "category": "dresses", "image": "/assets/shop/pexels-fashion/dresses/white-floral-dress-b9b6c3a4168d.webp", "width": 171, "height": 256, "source" const catalog=JSON.parse(document.querySelector('#catalog').textContent);let rejected=new Set();try{rejected=new Set(JSON.parse(localStorage.getItem('shop-rejected')||'[]'))}catch{}let category='All';const grid=document.querySelector('#grid'),filters=document.querySelector('#filters'),status=document.querySelector('#status');
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function link(url,text){const a=el('a',text);try{const u=new URL(url);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a}
function render(){filters.replaceChildren();for(const c of ['All',...new Set(catalog.map(x=>x.category))]){const n=c==='All'?catalog.length:catalog.filter(x=>x.category===c).length,b=el('button',`${c} (${n})`);b.setAttribute('aria-pressed',String(c===category));b.onclick=()=>{category=c;render()};filters.append(b)}grid.replaceChildren();if(!catalog.length){const p=el('p','No thumbnails collected yet. Run the collector from an environment that can access the permitted image sources, then regenerate this gallery.');p.className='empty';grid.append(p)}for(const item of catalog.filter(x=>category==='All'||x.category===category)){const card=el('article');card.className='card'+(rejected.has(item.id)?' rejected':'');const tile=el('div');tile.className='tile';const img=el('img');img.src='../'+item.image.replace(/^\/assets\/shop\//,'');img.alt=item.name;img.loading='lazy';tile.append(img);card.append(tile,el('h2',item.name),el('p',item.category));const license=el('p');license.append(link(item.license_url,item.license||'Licence not supplied'));card.append(license,el('p','Creator: '+(item.creator||'Not supplied')),el('p',item.attribution||''),link(item.source_url,'View source'));const reject=el('button',rejected.has(item.id)?'Undo reject':'Reject');reject.setAttribute('aria-pressed',String(rejected.has(item.id)));reject.onclick=()=>{rejected.has(item.id)?rejected.delete(item.id):rejected.add(item.id);try{localStorage.setItem('shop-rejected',JSON.stringify([...rejected]))}catch{}render()};card.append(reject);grid.append(card)}status.textContent=`${rejected.size} rejected`}
document.querySelector('#copy').onclick=async()=>{const ids=[...rejected].join('\n');try{await navigator.clipboard.writeText(ids);status.textContent=`Copied ${rejected.size} rejected IDs`}catch{const t=el('textarea');t.value=ids;t.setAttribute('aria-label','Rejected IDs — select and copy');document.querySelector('.bar').append(t);t.focus();t.select();status.textContent='Select and copy the IDs below'}};render();
</script></body></html>
