<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Shopping thumbnail review</title><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,600&family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#F6EFE3;color:#000;font-family:'Bricolage Grotesque',sans-serif;padding:24px 18px 130px}h1{font-family:'Bodoni Moda',serif;font-style:italic;font-size:clamp(38px,8vw,72px);margin:0 0 14px}button{font:inherit;cursor:pointer;background:white;border:2px solid black;padding:10px 16px;box-shadow:4px 4px 0 black}button:focus-visible,a:focus-visible{outline:3px solid #8b3048;outline-offset:5px}button[aria-pressed=true]{background:black;color:white}nav{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:#F6EFE3;border:2px solid black;box-shadow:6px 6px 0 black;padding:10px;overflow-wrap:anywhere}.tile{background:white;aspect-ratio:1;display:flex;align-items:center;justify-content:center}.tile img{max-width:100%;max-height:100%;object-fit:contain}.card h2{font-size:18px}.card p{font-size:14px;margin:8px 0}.card button{margin:15px 0 5px;width:100%}.rejected{outline:4px solid #8b3048}.bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:#F6EFE3;border-top:3px solid black;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.empty{font-size:18px;max-width:650px}@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}body{padding:40px 40px 120px}}
</style></head><body><h1>The shopping edit</h1><p>Review the thumbnails. Reject any image you don’t want to use.</p><nav aria-label="Categories" id="filters"></nav><main class="grid" id="grid"></main><footer class="bar"><button id="copy">Copy rejected IDs</button><span id="status" role="status" aria-live="polite"></span></footer><script type="application/json" id="catalog">__CATALOG__</script><script>
const catalog=JSON.parse(document.querySelector('#catalog').textContent);let rejected=new Set();try{rejected=new Set(JSON.parse(localStorage.getItem('shop-rejected')||'[]'))}catch{}let category='All';const grid=document.querySelector('#grid'),filters=document.querySelector('#filters'),status=document.querySelector('#status');
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function link(url,text){const a=el('a',text);try{const u=new URL(url);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a}
function render(){filters.replaceChildren();for(const c of ['All',...new Set(catalog.map(x=>x.category))]){const n=c==='All'?catalog.length:catalog.filter(x=>x.category===c).length,b=el('button',`${c} (${n})`);b.setAttribute('aria-pressed',String(c===category));b.onclick=()=>{category=c;render()};filters.append(b)}grid.replaceChildren();if(!catalog.length){const p=el('p','No thumbnails collected yet. Run the collector from an environment that can access the permitted image sources, then regenerate this gallery.');p.className='empty';grid.append(p)}for(const item of catalog.filter(x=>category==='All'||x.category===category)){const card=el('article');card.className='card'+(rejected.has(item.id)?' rejected':'');const tile=el('div');tile.className='tile';const img=el('img');img.src='../'+item.image.replace(/^\/assets\/shop\//,'');img.alt=item.name;img.loading='lazy';tile.append(img);card.append(tile,el('h2',item.name),el('p',item.category));const license=el('p');license.append(link(item.license_url,item.license||'Licence not supplied'));card.append(license,el('p','Creator: '+(item.creator||'Not supplied')),link(item.source_url,'View source'));const reject=el('button',rejected.has(item.id)?'Undo reject':'Reject');reject.setAttribute('aria-pressed',String(rejected.has(item.id)));reject.onclick=()=>{rejected.has(item.id)?rejected.delete(item.id):rejected.add(item.id);try{localStorage.setItem('shop-rejected',JSON.stringify([...rejected]))}catch{}render()};card.append(reject);grid.append(card)}status.textContent=`${rejected.size} rejected`}
document.querySelector('#copy').onclick=async()=>{const ids=[...rejected].join('\n');try{await navigator.clipboard.writeText(ids);status.textContent=`Copied ${rejected.size} rejected IDs`}catch{const t=el('textarea');t.value=ids;t.setAttribute('aria-label','Rejected IDs — select and copy');document.querySelector('.bar').append(t);t.focus();t.select();status.textContent='Select and copy the IDs below'}};render();
</script></body></html>
